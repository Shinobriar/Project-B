name: Build Billie Backup APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify preinstalled Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          gradle --no-daemon :app:tasks >/dev/null
          if [ -f "StickerTV/MediaProcessor.final.java" ] && [ -d ".stickertv-src" ]; then
            cp StickerTV/MediaProcessor.final.java .stickertv-src/app/src/main/java/com/raphael/stickertv/MediaProcessor.java
          fi
          gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f ".stickertv-src/app/build/outputs/apk/debug/app-debug.apk" ]; then
            APK=".stickertv-src/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          cp "$APK" BillieBackup-1.0.apk
          sha256sum BillieBackup-1.0.apk > BillieBackup-1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BillieBackup-APK
          path: |
            BillieBackup-1.0.apk
            BillieBackup-1.0.apk.sha256
          if-no-files-found: error
