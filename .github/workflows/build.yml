name: Build Billie Backup APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -8
          cp app/build/outputs/apk/debug/app-debug.apk BillieBackup-1.0.apk
          sha256sum BillieBackup-1.0.apk > BillieBackup-1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BillieBackup-APK
          path: |
            BillieBackup-1.0.apk
            BillieBackup-1.0.apk.sha256
          if-no-files-found: error
