name: Build StickerTV APK

on:
  push:
    branches:
      - sticker-tv-build
    paths:
      - 'StickerTV/**'
      - '.github/workflows/sticker-tv.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct StickerTV project
        run: |
          rm -rf /tmp/stickertv-src
          mkdir -p /tmp/stickertv-src
          cat StickerTV/project.part00 StickerTV/project.part01 StickerTV/project.part02 StickerTV/project.part03 | base64 -d > /tmp/stickertv-project.tgz
          tar -xzf /tmp/stickertv-project.tgz -C /tmp/stickertv-src
          test -f /tmp/stickertv-src/settings.gradle
          test -f /tmp/stickertv-src/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: /tmp/stickertv-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickerTV-debug
          path: /tmp/stickertv-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
